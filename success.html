<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're in - Just In Case</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="tagline-row">
            <a href="/"><img src="logo.jpg" alt="Just In Case logo" class="site-logo"></a>
            <h1>You're in.</h1>
        </div>
    </header>

    <main>
        <section id="success-summary" class="premium-column">
            <p id="jic-email">Your first email is on its way. Not there in 5 minutes? Check your spam folder, or email <a href="mailto:hello@justincaseimdead.com">hello@justincaseimdead.com</a>.</p>
            <a class="stripe-checkout-link" href="/">Go to the homepage</a>
        </section>
    </main>

    <script>
    (function () {
      var id = new URLSearchParams(location.search).get('session_id');
      if (!id) return;
      fetch('/api/session-email?session_id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.email) return;
        var b = document.createElement('strong'); b.textContent = d.email;
        var p = document.getElementById('jic-email'), a = p.querySelector('a');
        p.textContent = '';
        p.append('Your first email is on its way to ', b, '. Not there in 5 minutes? Check your spam folder, or email ', a, '.');
      }).catch(function () {});
    })();
    </script>
</body>
</html>
