<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Got it · Just In Case</title>
<style>
  body{margin:0;background:#F1ECE2;color:#2B2A26;font-family:Georgia,"Times New Roman",serif}
  a{color:#2F4A3A} a:hover{color:#8A6135}
  .wrap{max-width:560px;margin:0 auto;padding:64px 24px;text-align:center}
  img{width:120px;height:auto;margin-bottom:40px}
  h1{font-weight:normal;font-size:34px;line-height:1.2;margin:0 0 16px}
  p{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.6;color:#6B665C;margin:0 0 28px}
  .btn{display:inline-block;padding:14px 26px;border:0;border-radius:4px;background:#2F4A3A;color:#FBF8F2;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700;text-decoration:none;font-size:16px;cursor:pointer}
  .btn:hover{background:#243A2D;color:#FBF8F2}
  a:focus-visible,button:focus-visible{outline:3px solid #2F4A3A;outline-offset:2px}
  .skip-link{position:absolute;left:-9999px;top:0}
  .skip-link:focus{left:12px;top:12px;background:#fff;color:#2F4A3A;padding:8px 12px;z-index:1000}
  .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .card{background:#FBF8F2;border:1px solid #D3CBBB;border-radius:4px;padding:28px;text-align:left;margin:0 0 28px}
  .card .lab{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:#8A6135;margin:0 0 10px}
  .card .ct{font-size:26px;line-height:1.2;color:#2F4A3A;margin:0 0 10px}
  .card .cl{font-size:15px;line-height:1.5;color:#4A463F;margin:0 0 20px}
  .rows{border-top:1px solid #E3DCCE;margin:0;padding:0;list-style:none}
  .rows li{display:flex;gap:14px;padding-top:16px}
  .rows .n{font-size:22px;line-height:1.2;color:#8A6135;min-width:22px}
  .rows b{display:block;font-size:16px;color:#2B2A26;margin-bottom:2px}
  .rows span.d{font-size:15px;line-height:1.5;color:#4A463F}
  .note{font-size:14px;line-height:1.5;color:#6B665C;margin:14px 0 28px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .done-card{background:#FBF8F2;border:1px solid #D3CBBB;border-radius:4px;padding:28px;margin:0 0 24px}
  .done-card h2{font-size:21px;font-weight:normal;color:#2F4A3A;margin:0 0 8px}
  .done-card p{font-size:15px;margin:0}
  .confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}
  .confetti-piece{position:absolute;top:-12px;width:6px;height:9px;animation:confetti-fall 2.5s ease-in forwards}
  @keyframes confetti-fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
  @media(prefers-reduced-motion:reduce){.confetti{display:none}.confetti-piece{animation:none}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="wrap">
  <header><a href="/"><img src="https://www.justincaseimdead.com/logo.jpg" alt="Just In Case"></a></header>
  <main id="main">
    <h1 id="t">Got it.</h1>
    <p id="m">Thanks — we&rsquo;ve updated your plan.</p>
  </main>
</div>
<script>
  var M = {
    done: ['Nice work.', 'That&rsquo;s one more part of your plan your family won&rsquo;t have to guess at.'],
    doneweek: ['Nice work.', 'That&rsquo;s one more part of your plan your family won&rsquo;t have to guess at.'],
    donenow: ['Nice work.', 'That&rsquo;s one more part of your plan your family won&rsquo;t have to guess at.'],
    sent: ['Nice work.', 'On its way. Check your inbox in a few minutes.'],
    skip: ['No problem.', 'We&rsquo;ll bring that one back at the end. Your next email arrives in a few days.'],
    snooze: ['No problem.', 'We&rsquo;ll send this again later. Nothing is lost.'],
    easy: ['You&rsquo;re on easy mode.', 'Check your inbox &mdash; we&rsquo;ve just sent you the details. Your first question arrives in 2 days.<br><br>Changed your mind? Every easy mode email has a &ldquo;Switch back to weekly steps&rdquo; link at the bottom. You&rsquo;ll pick up where you left off.'],
    full: ['Back to weekly steps.', 'Your next step arrives tomorrow. Every weekly email has a link to switch to easy mode again.'],
    resume: ['Welcome back.', 'Your next step arrives within a day.'],
    restart: ['Starting fresh.', 'Step 1 arrives within a day. Your existing templates stay as they are.'],
    alldone: ['Brilliant &mdash; all 9 done.', 'We&rsquo;ll send the print step tomorrow.'],
    annual: ['Once a year it is.', 'You&rsquo;ll get one checkpoint a year. You can switch back any time.'],
    guided: ['Guided checkpoint on.', 'Your first short question arrives within a day.'],
    cpfull: ['One-email version it is.', 'Your checkpoint arrives within a day.'],
    unsub: ['You&rsquo;re unsubscribed.', 'You won&rsquo;t get any more plan emails. Your templates stay in your Google Drive.'],
    newsoff: ['Newsletter off.', 'You&rsquo;ll still get your checkpoints. Every article is on our website any time.'],
    newson: ['Monthly guides are back on.', 'You&rsquo;ll get the next one when it comes out.']
  };
  var a = new URLSearchParams(location.search).get('a');
  if (M[a]) { document.getElementById('t').innerHTML = M[a][0]; document.getElementById('m').innerHTML = M[a][1]; }
  var q = new URLSearchParams(location.search);
  if ((a === 'done' && q.get('p') !== '1') || a === 'doneweek' || a === 'donenow') {
    var title = a === 'done' ? 'Look out for your next email' : a === 'donenow' ? 'Ready for your next step?' : 'Look out for your next email';
    var box = document.createElement('div');
    box.className = 'done-card sans';
    box.innerHTML = '<h2>' + title + '</h2>';
    var main = document.getElementById('main');
    main.appendChild(box);
    if (a === 'donenow') {
      var c = q.get('c'), t = q.get('t');
      if (c && t) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/api/send-now';
        form.innerHTML = '<input type="hidden" name="c"><input type="hidden" name="t"><button class="btn" type="submit">Send it now</button>';
        form.elements.c.value = c;
        form.elements.t.value = t;
        box.appendChild(form);
      } else {
        box.insertAdjacentHTML('beforeend', '<p style="margin-top:12px">This send link is no longer available. Please use the link in your email.</p>');
      }
      box.insertAdjacentHTML('beforeend', '<p style="margin-top:12px">Or leave it, and it comes next week as usual.</p>');
    } else box.insertAdjacentHTML('beforeend', '<p>' + (a === 'done' ? 'Your next step arrives in about 3 days.' : 'Your next step arrives next week.') + '</p>');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var colors = ['#2F4A3A', '#8A6135', '#E6D9BF', '#F2B640', '#6E8577'];
      var layer = document.createElement('div');
      layer.className = 'confetti';
      layer.setAttribute('aria-hidden', 'true');
      for (var i = 0; i < 40; i++) {
        var piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        layer.appendChild(piece);
      }
      document.body.appendChild(layer);
      window.setTimeout(function () { layer.remove(); }, 3200);
    }
  }
  if (a === 'done' && q.get('p') === '1') {
    document.getElementById('t').innerHTML = 'Nice work. Your Cover Sheet is started.';
    document.getElementById('m').innerHTML = 'Template 2 arrives by email in about 3 days. Here&rsquo;s a look at it now, so you can start thinking.';
    var rows = [
      ['What to do first', 'Already written for you. You&rsquo;ll just add anything missing.'],
      ['Bank &amp; investment accounts', 'Which accounts do you have? Is someone named to get each one (POD or TOD)?'],
      ['Who to contact', 'Who should your family call first?'],
      ['Pet care', 'Vet, medical notes, and who takes them. No pets? You&rsquo;ll skip it.']
    ].map(function (r, i) { return '<li><span class="n">' + (i + 1) + '</span><div><b>' + r[0] + '</b><span class="d">' + r[1] + '</span></div></li>'; }).join('');
    var html = '<div class="card sans"><p class="lab">Coming next &middot; Template 2 &middot; About 15 min</p>' +
      '<h2 class="ct" style="font-family:Georgia,\'Times New Roman\',serif;font-weight:normal">Read This First</h2>' +
      '<p class="cl">The page your family opens first: what to do right away, who to call, and who looks after the pets.</p>' +
      '<ol class="rows" style="font-family:inherit">' + rows + '</ol></div>' +
      '<a class="btn" href="https://docs.google.com/document/d/1Yv3SXkTQ5AwokRpgeSFUlfuRovx4M9vEf8i0oUAJzOU/copy" target="_blank" rel="noopener">Get a head start: copy Template 2<span class="sr-only"> (opens in new tab)</span></a>' +
      '<p class="note">Totally optional. Then click File &rarr; Move and choose your Just In Case folder. The email still comes in 3 days with       step-by-step help.</p>';
    var main = document.getElementById('main');
    main.insertAdjacentHTML('beforeend', html);
  }
  if (a === 'newsoff' && q.get('c') && q.get('s')) document.getElementById('m').insertAdjacentHTML('afterend', '<p>Changed your mind? <a href="/api/action?a=newson&c=' + encodeURIComponent(q.get('c')) + '&s=' + encodeURIComponent(q.get('s')) + '">Turn monthly guides back on</a></p>');
</script>
</body>
</html>
